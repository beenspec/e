
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuminSDK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #games {
      width: 100%;
      height: 100%;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: #050505;

      transition:
        opacity 0.55s ease,
        visibility 0.55s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring {
      position: relative;
      width: 58px;
      height: 58px;
    }

    .loader-ring::before {
      content: "";
      position: absolute;
      inset: 0;

      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: #ffffff;
      border-right-color: rgba(255, 255, 255, 0.65);

      border-radius: 50%;

      animation: spin 0.85s linear infinite;
    }

    .loader-ring::after {
      content: "";
      position: absolute;
      inset: 7px;

      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.12);

      animation: pulse 1.4s ease-in-out infinite;
    }

    .loader-text {
      margin-top: 22px;

      color: #fff;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;

      opacity: 0.75;

      animation: textPulse 1.5s ease-in-out infinite;
    }

    .loader-dots {
      display: inline-block;
      width: 18px;
      text-align: left;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(0.85);
        opacity: 0.25;
      }

      50% {
        transform: scale(1);
        opacity: 0.8;
      }
    }

    @keyframes textPulse {
      0%, 100% {
        opacity: 0.45;
      }

      50% {
        opacity: 0.9;
      }
    }
  </style>
</head>

<body>

  <div id="loader">
    <div class="loader-ring"></div>

    <div class="loader-text">
      Loading LuminSDK<span class="loader-dots"></span>
    </div>
  </div>

  <div id="games"></div>

  <script>
    const dots = document.querySelector(".loader-dots");

    let dotCount = 0;

    setInterval(() => {
      dotCount = (dotCount + 1) % 4;
      dots.textContent = ".".repeat(dotCount);
    }, 350);
  </script>

  <script>
    window.addEventListener("error", function(e) {
      console.error(e.message);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>

  <script>
    const loader = document.getElementById("loader");

    if (typeof Lumin === "undefined") {
      document.querySelector(".loader-text").textContent =
        "Failed to load LuminSDK";
    } else {
      try {
        Lumin.init({
          container: "#games",
          theme: "dark"
        });

        setTimeout(() => {
          loader.classList.add("hidden");

          setTimeout(() => {
            loader.remove();
          }, 600);
        }, 1000);

      } catch (err) {
        console.error(err);

        document.querySelector(".loader-text").textContent =
          "Failed to initialize";
      }
    }
  </script>

</body>
</html>
