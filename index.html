```html
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuminSDK</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #games {
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 99999;
      padding: 12px 16px;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 14px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div id="status">Loading LuminSDK...</div>
<div id="games"></div>

<script>
  window.addEventListener("error", function(e) {
    document.getElementById("status").textContent =
      "ERROR:\n" + e.message;
  });
</script>

<script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>

<script>
  const status = document.getElementById("status");

  if (typeof Lumin === "undefined") {
    status.textContent =
      "LuminSDK did not load.\n\nThe CDN script could not create the Lumin object.";
  } else {
    status.textContent = "LuminSDK loaded. Initializing...";

    try {
      Lumin.init({
        container: "#games",
        theme: "dark"
      });

      setTimeout(() => {
        status.remove();
      }, 1500);

    } catch (err) {
      status.textContent =
        "Lumin.init() failed:\n\n" + err.stack;
    }
  }
</script>

</body>
</html>
